name: TimePRO
version: "0.1.3"
slug: timepro
description: Private time-management companion with native phone pairing
url: https://github.com/TKtheDEV/timepro-home-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:head-cog-outline
panel_title: TimePRO
panel_admin: true
watchdog: http://[HOST]:8099/health
map:
  - type: ssl
    read_only: true
ports:
  8443/tcp: null
  8216/tcp: null
ports_description:
  8443/tcp: Optional HTTPS phone API (phone_access = tls)
  8216/tcp: Optional upstream for a trusted TLS proxy (phone_access = reverse_proxy)
backup: cold
backup_exclude:
  - models/**
options:
  initial_timezone: America/New_York
  phone_access: disabled
  public_url: ""
  certfile: fullchain.pem
  keyfile: privkey.pem
  built_in_model: false
  model_threads: 2
schema:
  initial_timezone: str
  phone_access: list(disabled|tls|reverse_proxy)
  public_url: str
  certfile: str
  keyfile: str
  built_in_model: bool
  model_threads: int(1,4)
